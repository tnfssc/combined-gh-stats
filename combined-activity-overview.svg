<svg xmlns="http://www.w3.org/2000/svg" width="760" height="271" viewBox="0 0 760 271" role="img" aria-label="Combined GitHub Activity Overview">
  <style>
    svg {
      --bg: #ffffff;
      --card-stroke: #d0d7de;
      --fg: #1f2328;
      --fg-muted: #656d76;
      --divider: #d0d7de;
      --accent: #0969da;
      --bar-track: #eaeef2;
      --bar-fill: #1f883d;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117;
        --card-stroke: #30363d;
        --fg: #f0f6fc;
        --fg-muted: #8b949e;
        --divider: #30363d;
        --accent: #58a6ff;
        --bar-track: #21262d;
        --bar-fill: #3fb950;
      }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .card { fill: var(--bg); stroke: var(--card-stroke); }
    .fg { fill: var(--fg); }
    .fg-muted { fill: var(--fg-muted); }
    .accent { fill: var(--accent); }
    .divider { stroke: var(--divider); fill: none; }
    .bar-track { fill: var(--bar-track); }
    .bar-fill { fill: var(--bar-fill); }
  </style>

  <circle class="repo-dot" cx="37" cy="201" r="4" /><text class="accent" x="50" y="206" font-size="15" font-weight="600">kortix-ai/suna (556)</text><circle class="repo-dot" cx="37" cy="225" r="4" /><text class="accent" x="50" y="230" font-size="15" font-weight="600">tnfssc/sharath.boi.gg (77)</text><circle class="repo-dot" cx="37" cy="249" r="4" /><text class="accent" x="50" y="254" font-size="15" font-weight="600">tnfssc/skillz (51)</text><text class="fg-muted" x="32" y="290" font-size="13">and 23 other repositories</text>
